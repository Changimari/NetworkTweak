name: Windows Build

on:
  push:
    branches: [ "**" ]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/NetworkTweak.sln

      - name: Build
        run: dotnet build windows/NetworkTweak.sln -c Release --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish windows/NetworkTweak/NetworkTweak.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkTweak-win-x64
          path: publish/NetworkTweak.exe
