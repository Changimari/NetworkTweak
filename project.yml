name: NetworkMenuBar
options:
  bundleIdPrefix: com.sakai
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    PRODUCT_NAME: NetworkTweak
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  NetworkMenuBar:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: NetworkMenuBar
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: NetworkMenuBar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetworkMenuBar/Resources/NetworkMenuBar.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sakai.NetworkMenuBar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: NetworkMenuBar/Resources/Info.plist
      properties:
        CFBundleName: NetworkTweak
        CFBundleDisplayName: NetworkTweak
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleLocalizations: [ja, en]
        NSLocalNetworkUsageDescription: ネットワークアダプタの情報取得と空きIPアドレスの検索に使用します。
        NSAppleEventsUsageDescription: ネットワーク設定の変更に管理者権限が必要です。
        # Sparkle 自動アップデート
        SUFeedURL: https://raw.githubusercontent.com/Changimari/NetworkTweak/main/appcast.xml
        SUPublicEDKey: WTp4bwWyRmmPEfE3/OkXHmL/F86/7NEV4764o0dUM3M=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: NetworkMenuBar/Resources/NetworkMenuBar.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.hardened-runtime: true
        com.apple.security.automation.apple-events: true
